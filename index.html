<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Curral">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Lista do Curral</title>
<style>
:root{
  --bg:#f4f6f4; --card:#fff; --card2:#fbfcfb; --ink:#16211c; --mut:#5f6f66; --line:#dde4df;
  --pri:#15624a; --pri-l:#e6f0eb; --ok:#2c7a58; --ok-l:#e2f2ea;
  --dan:#a63a2b; --dan-l:#fae9e6; --warn:#8a6d15; --warn-l:#faf3dc;
  --neu:#5f6f66; --neu-l:#eceff0; --sel:#fff; --sombra:0 1px 2px rgba(15,40,30,.06);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#101613; --card:#18211d; --card2:#1d2823; --ink:#e8efea; --mut:#93a49a; --line:#26332c;
  --pri:#57b48f; --pri-l:#173229; --ok:#5cbc92; --ok-l:#122c22;
  --dan:#e08171; --dan-l:#331915; --warn:#d7b455; --warn-l:#2e2712;
  --neu:#93a49a; --neu-l:#212b26; --sel:#101613; --sombra:none;
} }
:root[data-theme="dark"]{
  --bg:#101613; --card:#18211d; --card2:#1d2823; --ink:#e8efea; --mut:#93a49a; --line:#26332c;
  --pri:#57b48f; --pri-l:#173229; --ok:#5cbc92; --ok-l:#122c22;
  --dan:#e08171; --dan-l:#331915; --warn:#d7b455; --warn-l:#2e2712;
  --neu:#93a49a; --neu-l:#212b26; --sel:#101613; --sombra:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto}

header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.tit{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.tit h1{font-size:16px;font-weight:650;margin:0;letter-spacing:-.01em}
.tit span{font-size:11.5px;color:var(--mut)}
.busca{position:relative;display:flex}
.busca input{flex:1;width:100%;height:48px;padding:0 42px 0 14px;font-size:17px;
  border:1.5px solid var(--line);border-radius:12px;background:var(--card2);color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.busca input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.busca input::placeholder{font-family:-apple-system,system-ui,sans-serif;color:var(--mut)}
.limpar{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;background:none;
  color:var(--mut);font-size:20px;cursor:pointer;border-radius:10px}
.limpar:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}

.chips{display:flex;gap:7px;overflow-x:auto;margin-top:9px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:17px;
  background:var(--card2);color:var(--mut);font-size:13.5px;font-weight:550;cursor:pointer;white-space:nowrap;
  font-family:inherit}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--sel)}
.chip:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
select.chip{appearance:none;-webkit-appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 14px) 15px,calc(100% - 9px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

.conta{padding:9px 16px 4px;margin:0;font-size:12.5px;color:var(--mut)}
.conta b{color:var(--ink);font-variant-numeric:tabular-nums}

ul{list-style:none;margin:0;padding:0 16px 20px}
li{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:10px;
  margin-top:8px;box-shadow:var(--sombra);overflow:hidden}
li.s-faz{border-left-color:var(--ok)} li.s-tira{border-left-color:var(--dan)}
li.s-esp{border-left-color:var(--warn)} li.s-neu{border-left-color:var(--line)}
.linha{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;min-height:60px}
.linha:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.esq{flex:1;min-width:0}
.br{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.nome{font-size:13px;color:var(--mut);margin-left:7px;font-weight:400;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dir{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;max-width:46%}
.pill{display:inline-block;padding:3px 9px;border-radius:11px;font-size:11.5px;font-weight:650;
  letter-spacing:.01em;white-space:nowrap;text-align:right}
.p-ok{background:var(--ok-l);color:var(--ok)} .p-bad{background:var(--dan-l);color:var(--dan)}
.p-warn{background:var(--warn-l);color:var(--warn)} .p-neu{background:var(--neu-l);color:var(--neu)}
.marca{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:5px;
  font-size:10.5px;font-weight:700;margin-left:5px;vertical-align:2px;background:var(--warn-l);color:var(--warn);
  font-family:-apple-system,system-ui,sans-serif}

.det{border-top:1px solid var(--line);background:var(--card2);padding:12px 13px 14px}
.det h4{margin:0 0 8px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.gr+h4,.nota+h4,.ops+h4{margin-top:14px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:9px 12px}
.kv .k{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.kv .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.nota{margin-top:12px;font-size:12.5px;color:var(--mut);line-height:1.5}
.nota b{color:var(--ink);font-weight:600}

.tou{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:4px;font-size:12.5px;color:var(--mut)}
.tou b{color:var(--ink);font-weight:600}.tou i{font-style:normal;font-size:11.5px}
.ops{width:100%;border-collapse:collapse;margin:4px 0 2px;font-size:14px}
.ops td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
.ops .on{width:18px;color:var(--mut);font-weight:700}.ops .can{white-space:nowrap;color:var(--mut);font-size:12.5px}
.ops .fi{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut);font-size:12.5px}
.ops .av{font-size:11.5px;color:var(--warn);margin-top:2px}
.vazio{text-align:center;color:var(--mut);font-size:14px;padding:44px 20px}
.mais{display:block;width:calc(100% - 32px);margin:0 auto;height:46px;border:1px dashed var(--line);
  background:var(--card);color:var(--pri);font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;
  font-family:inherit}
footer{padding:18px 16px 30px;font-size:11.5px;color:var(--mut);line-height:1.6}
footer b{color:var(--ink);font-weight:600}
</style>
<style>
[hidden]{display:none!important}
.trava{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.trava form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:26px 22px;box-shadow:var(--sombra)}
.trava h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.02em}
.trava p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.5}
.trava input[type=password]{height:50px;padding:0 14px;font-size:17px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--card2);color:var(--ink);font-family:inherit}
.trava input[type=password]:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.trava label{display:flex;gap:9px;align-items:center;font-size:14px;color:var(--ink)}
.trava input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri)}
.trava button{height:50px;border:0;border-radius:12px;background:var(--pri);color:var(--sel);font-size:16px;font-weight:650;
  font-family:inherit;cursor:pointer}
.trava button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.trava button[disabled]{opacity:.6}
.trava .erro{color:var(--dan);font-weight:600;min-height:1.2em}
.esquecer{display:block;margin:0 auto 34px;border:0;background:none;color:var(--mut);font-size:12.5px;
  text-decoration:underline;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="trava" id="trava" hidden>
  <form id="fTrava" autocomplete="on">
    <h1>Lista do Curral</h1>
    <p>Chácara Nielt · dados de 19/09/2026. Digite a senha que o Emilio passou.</p>
    <input id="senha" type="password" inputmode="text" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required>
    <label><input id="lembrar" type="checkbox" checked> Lembrar neste celular</label>
    <button id="entrar" type="submit">Entrar</button>
    <p class="erro" id="erro" role="alert"></p>
  </form>
</div>
<div id="app" hidden>
<div class="wrap">
<header>
  <div class="tit"><h1>Lista do Curral</h1><span id="dia"></span></div>
  <div class="busca">
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Buscar brinco ou nome">
    <button class="limpar" id="limpar" type="button" aria-label="Limpar busca" hidden>&#10005;</button>
  </div>
  <div class="chips" id="chips">
    <button class="chip" type="button" data-f="hoje" aria-pressed="false">Inseminar hoje</button>
    <button class="chip" type="button" data-f="Sexado" aria-pressed="false">Sexado</button>
    <button class="chip" type="button" data-f="Angus" aria-pressed="false">Angus</button>
    <button class="chip" type="button" data-f="Elite" aria-pressed="false">Elite</button>
    <button class="chip" type="button" data-f="Inferior" aria-pressed="false">Inferior</button>
    <select class="chip" id="fLote" aria-label="Lote"></select>
    <select class="chip" id="fCat" aria-label="Categoria"></select>
  </div>
</header>
<p class="conta" id="conta"></p>
<ul id="lista"></ul>
<button class="mais" id="mais" type="button" hidden></button>
<footer id="rodape"></footer>
</div>

<button class="esquecer" id="esquecer" type="button">Esquecer a senha neste celular</button>
</div>

function iniciaLista(){

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(v,d)=>v==null?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const dataBR=o=>new Date(P.dia+'T12:00:00').toLocaleDateString('pt-BR',o);

$('#dia').textContent=dataBR({day:'2-digit',month:'short',year:'numeric'});
$('#fLote').innerHTML='<option value="">Todos os lotes</option>'+P.lotes.map(l=>'<option>'+esc(l)+'</option>').join('');
$('#fCat').innerHTML='<option value="">Todas</option>'+[...new Set(P.an.map(a=>a.ct))].map(c=>'<option>'+esc(c)+'</option>').join('');
$('#rodape').innerHTML='Mérito e próximo passo são calculados dentro de cada categoria, pelo índice <b>'+esc(P.idx)+
  '</b>: Elite = '+P.top+'% melhores, Inferior = '+P.bot+'% piores. <b>D</b> = já marcada como descarte no seu controle, '+
  '<b>H</b> = portadora de haplótipo. Sêmen: verde = sexado, vermelho = Angus, sem cor = convencional; tarja amarela = ainda não é hora (prenha ou inseminada). Touros 1, 2 e 3 com o caneco (c). ▲ = alerta, toque para ler. Dados de '+dataBR()+
  ' — rode o Atualizar_Relatorio.cmd e recopie este arquivo para renovar.';

const EXEC=a=>!!a.x;
const faixa=a=>!a.ty?'s-neu':!a.x?'s-esp':a.ty==='Sexado'?'s-faz':a.ty==='Angus'?'s-tira':'s-neu';
const corPasso=a=>!a.ty?'p-warn':a.ty==='Sexado'?'p-ok':a.ty==='Angus'?'p-bad':'p-neu';
const corMerito=m=>m==='Elite'?'p-ok':m==='Inferior'?'p-bad':'p-neu';

let filtros={hoje:false,Elite:false,Inferior:false,Sexado:false,Angus:false}, lote='', cat='', busca='', limite=40, aberto=null;

function filtra(){
  const q=busca.toLowerCase();
  return P.an.filter(a=>{
    if(q && !((a.b||'').toLowerCase().includes(q) || (a.n||'').toLowerCase().includes(q))) return false;
    if(lote && a.lo!==lote) return false;
    if(cat && a.ct!==cat) return false;
    if(filtros.hoje && !EXEC(a)) return false;
    if(filtros.Sexado && a.ty!=='Sexado') return false;
    if(filtros.Angus && a.ty!=='Angus') return false;
    if(filtros.Elite && a.m!=='Elite') return false;
    if(filtros.Inferior && a.m!=='Inferior') return false;
    return true;
  }).sort((x,y)=>{
    if(q){ const ex=(x.b||'').toLowerCase()===q, ey=(y.b||'').toLowerCase()===q; if(ex!==ey) return ex?-1:1; }
    return (y.i==null?-1e9:y.i)-(x.i==null?-1e9:x.i);
  });
}

function detalhe(a){
  const g=[], r=[];
  const cel=(arr,k,v)=>arr.push('<div class="kv"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>');
  if(a.i!=null){ cel(g,'Índice',nf(a.i,1)); cel(g,'Percentil',a.p+'%'); }
  if(a.t.tpi!=null) cel(g,'TPI',nf(a.t.tpi,0));
  if(a.t.nm!=null) cel(g,'NM$',nf(a.t.nm,0));
  if(a.t.vp!=null) cel(g,'VP',nf(a.t.vp,2));
  if(a.t.solidos!=null) cel(g,'Sólidos',nf(a.t.solidos,0));
  if(a.t.leite!=null) cel(g,'Leite',nf(a.t.leite,0));
  if(a.t.dpr!=null) cel(g,'DPR',nf(a.t.dpr,2));
  if(a.t.ccs!=null) cel(g,'CCS',nf(a.t.ccs,2));
  if(a.a2) cel(g,'Beta-caseína',esc(a.a2));

  if(a.se) cel(r,'Lactação',esc(a.se)+(a.dl!=null?' <span class="k">'+a.dl+' DEL</span>':''));
  if(a.cm&&a.cm.dg!=null) cel(r,'Gestação',a.cm.dg+' d');
  if(a.cm&&a.cm.pp) cel(r,'Prev. parto','<span style="font-size:13px">'+esc(a.cm.pp)+'</span>');
  if(a.cm&&a.cm.ns!=null) cel(r,'Serviços',a.cm.ns);
  if(a.cm&&a.cm.cp!=null) cel(r,'Cios PEV',a.cm.cp);
  if(a.cm&&a.cm.ppi) cel(r,'Pós-parto','<span style="font-size:13px">'+esc(a.cm.ppi)+'</span>');
  if(a.rr) cel(r,'Repro','<span style="font-size:13px">'+esc(a.rr)+'</span>');
  if(a.im!=null) cel(r,'Idade',a.im>=24?Math.floor(a.im/12)+'a'+(a.im%12?' '+(a.im%12)+'m':''):a.im+'m');
  if(a.cm&&a.cm.tou) cel(r,'Últ. touro','<span style="font-size:12.5px">'+esc(a.cm.tou.slice(0,24))+(a.cm.corte?' (corte)':'')+'</span>');

  let ac='';
  if(a.a){
    ac='<h4>Acasalamento</h4><div class="nota" style="margin-top:0"><b>'+esc(a.a)+'</b> — '+esc(a.mo||'')+'</div>';
    if(a.op&&a.op.length) ac+='<table class="ops">'+a.op.map((o,i)=>'<tr><td class="on">'+(i+1)+'</td><td><b>'+esc(o.n)+'</b>'+(o.av?'<div class="av">▲ '+esc(o.av)+'</div>':'')+'</td><td class="can">caneco '+esc(o.c)+'</td><td class="fi">'+(o.f==null?'':'filha '+o.f)+'</td></tr>').join('')+'</table>';
    if(a.rm) ac+='<div class="nota">↻ Opção 1 trocada pelo limite de 25% por touro — o melhor para ela seria <b>'+esc(a.rm)+'</b>.</div>';
    if(a.ex) ac+='<div class="nota">Descartados: '+esc(a.ex)+'</div>';
    ac+='<div class="nota">Pai: '+(a.pai?'<b>'+esc(a.pai)+'</b>':'não informado')+' · Mãe: '+(a.mae?'<b>'+esc(a.mae)+'</b>':'não informada')+'</div>';
  }
  let n='';
  if(!a.lb) n='<div class="nota">Sem genoma — não entra no ranking. <b>Genotipar</b> para saber onde ela está.</div>';
  else if(a.m==='Elite'&&a.rr==='Baixa') n='<div class="nota"><b>Elite com reprodução baixa.</b> Vale o sexado pela genética, mas a dose tem chance reduzida de emprenhar nela.</div>';
  if(a.hp) n+='<div class="nota">Portadora do haplótipo <b>'+esc(a.hp)+'</b>. Não cruzar com touro portador do mesmo.</div>';
  if(a.d) n+='<div class="nota">Já marcada como <b>descarte</b> no seu controle.</div>';

  return '<div class="det">'+
    (g.length?'<h4>Genética</h4><div class="gr">'+g.join('')+'</div>':'')+
    ac+(r.length?'<h4>Situação</h4><div class="gr">'+r.join('')+'</div>':'')+n+'</div>';
}

function render(){
  const rows=filtra(), mostra=rows.slice(0,limite);
  const nE=rows.filter(a=>a.m==='Elite').length, nI=rows.filter(a=>a.m==='Inferior').length;
  const nH=rows.filter(a=>EXEC(a)).length;
  $('#conta').innerHTML='<b>'+rows.length+'</b> '+(rows.length===1?'animal':'animais')+' · '+nE+' elite · '+nI+
    ' inferior · <b>'+nH+'</b> para inseminar hoje';

  if(!rows.length){
    $('#lista').innerHTML='<li class="s-neu"><div class="vazio">Nenhum animal com esses filtros.</div></li>';
    $('#mais').hidden=true; return;
  }
  $('#lista').innerHTML=mostra.map(a=>{
    const ab=aberto===a.b;
    return '<li class="'+faixa(a)+'"><div class="linha" tabindex="0" role="button" aria-expanded="'+ab+'" data-b="'+esc(a.b)+'">'+
      '<div class="esq"><div class="br mono">'+esc(a.b)+
        (a.d?'<span class="marca" title="marcada como descarte">D</span>':'')+
        (a.hp?'<span class="marca" title="portadora de haplótipo">H</span>':'')+
        (a.n?'<span class="nome">'+esc(a.n)+'</span>':'')+'</div>'+
      '<div class="sub">'+esc(a.ct)+(a.lo?' · '+esc(a.lo):'')+(a.st?' · '+esc(a.st):'')+'</div>'+
      (a.op&&a.op.length?'<div class="tou">'+a.op.map((o,i)=>'<span>'+(i+1)+' <b>'+esc(o.n)+'</b> <i>c'+esc(o.c)+'</i>'+(o.av?' ▲':'')+'</span>').join('')+'</div>':'')+'</div>'+
      '<div class="dir">'+
        (a.m?'<span class="pill '+corMerito(a.m)+'">'+a.m+'</span>':'<span class="pill p-neu">sem genoma</span>')+
        (a.a?'<span class="pill '+corPasso(a)+'">'+esc(a.a)+'</span>':'')+
      '</div></div>'+(ab?detalhe(a):'')+'</li>';
  }).join('');

  $('#mais').hidden=rows.length<=limite;
  $('#mais').textContent='Mostrar mais '+Math.min(60,rows.length-limite)+' — faltam '+(rows.length-limite);
}

function alterna(el){ aberto = aberto===el.dataset.b ? null : el.dataset.b; render(); }
$('#lista').addEventListener('click',e=>{ const l=e.target.closest('.linha'); if(l) alterna(l); });
$('#lista').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const l=e.target.closest('.linha'); if(!l) return; e.preventDefault(); alterna(l);
});
$('#q').addEventListener('input',e=>{ busca=e.target.value.trim(); limite=40; aberto=null;
  $('#limpar').hidden=!busca; render(); });
$('#limpar').addEventListener('click',()=>{ $('#q').value=''; busca=''; limite=40;
  $('#limpar').hidden=true; $('#q').focus(); render(); });
document.querySelectorAll('.chip[data-f]').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.f; filtros[k]=!filtros[k];
  if(k==='Elite'&&filtros.Elite) filtros.Inferior=false;
  if(k==='Inferior'&&filtros.Inferior) filtros.Elite=false;
  document.querySelectorAll('.chip[data-f]').forEach(x=>x.setAttribute('aria-pressed',String(filtros[x.dataset.f])));
  limite=40; render();
}));
$('#fLote').addEventListener('change',e=>{lote=e.target.value;limite=40;render();});
$('#fCat').addEventListener('change',e=>{cat=e.target.value;limite=40;render();});
$('#mais').addEventListener('click',()=>{limite+=60;render();});
render();

}
async function entrar(senha,lembrar){
  try{ P=await decifra(senha); }catch(e){ return false; }
  try{ if(lembrar) localStorage.setItem(CHAVE_SENHA,senha); else localStorage.removeItem(CHAVE_SENHA); }catch(e){}
  document.getElementById('trava').hidden=true; document.getElementById('app').hidden=false;
  iniciaLista(); return true;
}
document.getElementById('fTrava').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=document.getElementById('entrar'), er=document.getElementById('erro');
  b.disabled=true; b.textContent='Abrindo…'; er.textContent='';
  const ok=await entrar(document.getElementById('senha').value,document.getElementById('lembrar').checked);
  if(!ok){ b.disabled=false; b.textContent='Entrar'; er.textContent='Senha errada. Confira com o Emilio.'; document.getElementById('senha').select(); }
});
document.getElementById('esquecer').addEventListener('click',()=>{ try{localStorage.removeItem(CHAVE_SENHA);}catch(e){} location.reload(); });
(async()=>{
  let s=null; try{ s=localStorage.getItem(CHAVE_SENHA); }catch(e){}
  if(s&&await entrar(s,true)) return;
  document.getElementById('trava').hidden=false; document.getElementById('senha').focus();
})();
if(!window.crypto||!crypto.subtle){ document.getElementById('erro').textContent='Abra pelo endereço https:// no Safari.'; }
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
